<!DOCTYPE html>
<html>
<style>
div {
  width: 175px;
  margin: auto;
}
</style>
<head>
    <meta charset="UTF-8" />
    <title>Search</title>
</head>
    <h1 style="text-align:center;">Group Search</h1>
<body>
    <div>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name">
    </div>

    <br>

    <div>
        <label for="loc">Location:</label><br>
        <input type="text" id="loc" loc="loc">
    </div>

    <br>

    <div>
        <p>Type:</p>
    </div>
    <div>
        <input type="radio" id="Environmental" name="type" value="Environmental">
        <label for="Environmental">Environmental</label><br>
        <input type="radio" id="Animal-Welfare" name="type" value="Animal Welfare">
        <label for="Animal Welfare">Animal Welfare</label><br>
        <input type="radio" id="Social-Development" name="type" value="Social Development">
        <label for="Social Development">Social Development</label><br>
        <input type="radio" id="Senior-Assistance" name="type" value="Senior Assistance">
        <label for="Senior Assistance">Senior Assistance</label><br>
        <input type="radio" id="Other" name="type" value="Other">
        <label for="Other">Other</label><br>
    </div>
    
    <br>

    <div>
        <button style="background-color:#38761D;" onclick="document.location='index.html'" type="button">Search</button>
    </div>
</body>
</html>
